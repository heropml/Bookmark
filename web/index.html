<!DOCTYPE html>
<html lang="zh-CN" data-skin="aurora" data-icon="logo" data-layout="classic" data-motion="float" data-fx="on" data-trail="stardust" data-sky="auto">
<head>
  <script>
    try {
      const url = new URL(location.href);
      if (url.searchParams.get("window") === "maximized") {
        try {
          window.moveTo(screen.availLeft, screen.availTop);
          window.resizeTo(screen.availWidth, screen.availHeight);
        } finally {
          url.searchParams.delete("window");
          history.replaceState(null, "", url.pathname + url.search + url.hash);
        }
      }
    } catch (e) {}
    try {
      let s = localStorage.getItem("bm-skin");
      if (s === "auto") s = matchMedia("(prefers-color-scheme: light)").matches ? "snow" : "aurora";
      const i = localStorage.getItem("bm-icon");
      const l = localStorage.getItem("bm-layout");
      const m = localStorage.getItem("bm-motion");
      const f = localStorage.getItem("bm-fx");
      const t = localStorage.getItem("bm-trail");
      const k = localStorage.getItem("bm-sky");
      if (s) document.documentElement.dataset.skin = s;
      if (i) document.documentElement.dataset.icon = i;
      if (l) document.documentElement.dataset.layout = l;
      if (m) document.documentElement.dataset.motion = m;
      if (t) document.documentElement.dataset.trail = t;
      if (k) document.documentElement.dataset.sky = k;
      if (f === "on" || f === "off") document.documentElement.dataset.fx = f;
      const fav = document.createElement("link");
      fav.rel = "icon";
      fav.id = "fav";
      fav.href = "/__favicon?skin=" + encodeURIComponent(s || "aurora");
      document.head.appendChild(fav);
    } catch (e) {}
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>书签</title>
  <style>
    :root {
      --text: #eef4ff;
      --muted: #8fa0c4;
      --glass: rgba(12, 18, 36, 0.58);
      --stroke: rgba(255, 255, 255, 0.12);
      --glow: rgba(86, 196, 255, 0.38);
      --bg: #040711;
      --radius: 18px;
      --radius-sm: 12px;
      --mx: 50%;
      --my: 18%;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    html { background: var(--bg); }
    body {
      margin: 0;
      color: var(--text);
      font: 15px/1.45 "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      background: transparent;
      overflow-x: hidden;
    }
    header, .layout { position: relative; z-index: 2; }
    .aurora {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(900px 520px at 8% -8%, rgba(56, 189, 248, 0.42), transparent 58%),
        radial-gradient(720px 480px at 92% 6%, rgba(168, 85, 247, 0.38), transparent 52%),
        radial-gradient(780px 520px at 70% 108%, rgba(34, 211, 238, 0.22), transparent 52%),
        linear-gradient(180deg, #07101f, #050814 42%, #03050c);
    }
    .aurora::before,
    .aurora::after {
      content: "";
      position: absolute;
      inset: -10%;
      pointer-events: none;
    }
    .aurora::before {
      background:
        radial-gradient(42vmax 28vmax at 18% 22%, rgba(59, 130, 246, 0.22), transparent 62%),
        radial-gradient(36vmax 24vmax at 82% 18%, rgba(217, 70, 239, 0.16), transparent 64%),
        radial-gradient(30vmax 22vmax at 58% 78%, rgba(45, 212, 191, 0.12), transparent 66%);
      animation: drift 10s ease-in-out infinite alternate;
    }
    .aurora::after {
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at 50% 28%, #000 18%, transparent 72%);
      opacity: 0.7;
    }
    .cursor-glow {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(420px 300px at var(--mx) var(--my), rgba(125, 211, 255, 0.32), transparent 55%),
        radial-gradient(180px 140px at var(--mx) var(--my), rgba(255, 255, 255, 0.12), transparent 45%);
    }
    @keyframes drift {
      from { transform: translate3d(-4%, -2%, 0) scale(1); }
      to { transform: translate3d(5%, 4%, 0) scale(1.12); }
    }
    #fx-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .bg-clock {
      position: fixed;
      right: 3vw;
      bottom: 1vh;
      z-index: 1;
      display: grid;
      justify-items: end;
      gap: 10px;
      pointer-events: none;
      user-select: none;
      color: var(--text);
      opacity: 0.055;
    }
    .bg-clock .bg-date {
      font-size: clamp(13px, 1.3vw, 17px);
      letter-spacing: 0.4em;
      margin-right: -0.4em;
    }
    .bg-clock .bg-time {
      font-size: clamp(110px, 20vw, 300px);
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    html[data-fx="on"] .aurora::before {
      translate: calc((var(--mx) - 50vw) * 0.045) calc((var(--my) - 50vh) * 0.045);
      transition: translate 1.1s cubic-bezier(0.16, 0.84, 0.44, 1);
    }
    html[data-fx="on"] .aurora::after {
      translate: calc((var(--mx) - 50vw) * -0.02) calc((var(--my) - 50vh) * -0.02);
      transition: translate 1.4s cubic-bezier(0.16, 0.84, 0.2, 1);
    }
    html[data-fx="on"] .aurora,
    html[data-fx="on"] #fx-canvas {
      transition: filter 0.45s ease, opacity 0.45s ease, transform 0.45s ease;
    }
    html[data-fx="on"] body.searching .aurora {
      filter: blur(7px) brightness(0.78) saturate(1.12);
      transform: scale(1.025);
    }
    html[data-fx="on"] body.searching #fx-canvas {
      opacity: 0.35;
    }
    header {
      display: grid;
      grid-template-columns: minmax(220px, auto) 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 22px 28px 10px;
    }
    .hello {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      height: 54px;
    }
    .hello .time {
      flex: 0 0 auto;
      font-size: 42px;
      font-weight: 720;
      letter-spacing: 0.06em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      background: linear-gradient(110deg, #f8fbff 10%, #7dd3fc 48%, #c084fc 92%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(125, 211, 252, 0.28));
    }
    .hello-meta {
      position: relative;
      display: grid;
      gap: 5px;
      min-width: 0;
      max-width: min(190px, 42vw);
      padding-left: 15px;
      white-space: nowrap;
    }
    .hello-meta::before {
      content: "";
      position: absolute;
      left: 0;
      top: 2px;
      bottom: 2px;
      width: 1px;
      background: linear-gradient(180deg, transparent, var(--glow) 22%, var(--stroke) 78%, transparent);
      box-shadow: 0 0 10px var(--glow);
    }
    .hello .greet {
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;

      letter-spacing: 0.04em;
      text-overflow: ellipsis;
    }
    .weather {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      max-width: 100%;
      padding: 0;
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      line-height: 1.25;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-align: left;
    }
    .weather:hover { color: var(--text); }
    .weather .w-ico { display: inline-grid; place-items: center; flex: 0 0 auto; }
    .weather .w-ico svg { width: 14px; height: 14px; }
    .weather .w-txt {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .search {
      position: relative;
      max-width: 640px;
      margin: 0 auto;
      width: 100%;
    }
    .search::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 18px;
      background: linear-gradient(120deg, rgba(125,211,252,0.55), rgba(192,132,252,0.2), rgba(45,212,191,0.35));
      opacity: 0.35;
      z-index: -1;
      filter: blur(0.2px);
    }
    .search input {
      width: 100%;
      height: 54px;
      border: 1px solid var(--stroke);
      border-radius: calc(var(--radius) - 2px);
      padding: 0 18px 0 48px;
      color: var(--text);
      background: rgba(12, 18, 36, 0.42);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255,255,255,0.1);
      outline: none;
      font: inherit;
    }
    .search input:focus {
      border-color: rgba(125, 211, 252, 0.7);
      box-shadow: 0 0 0 4px var(--glow), 0 16px 48px rgba(0, 0, 0, 0.35);
    }
    .search-kbd {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      padding: 3px 8px;
      border: 1px solid var(--stroke);
      border-radius: 7px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      font-size: 11px;
      line-height: 1;
      letter-spacing: 0.08em;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .search input:focus ~ .search-kbd,
    .search input:not(:placeholder-shown) ~ .search-kbd { opacity: 0; }
    .search-ico {
      position: absolute;
      left: 16px;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .switch {
      cursor: pointer;
      font: inherit;
      color: var(--text);
    }
    .switch:hover { border-color: rgba(255,255,255,0.28); color: var(--text); }
    .switch b { font-weight: 650; }
    .switch i { font-style: normal; color: var(--muted); margin-right: 6px; font-size: 12px; }
    .appearance-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font: inherit;
      color: var(--text);
    }
    .appearance-trigger svg { width: 16px; height: 16px; color: #7dd3fc; }
    .appearance-trigger[aria-expanded="true"] {
      border-color: rgba(125, 211, 252, 0.55);
      box-shadow: 0 0 24px var(--glow), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .appearance-panel {
      position: fixed;
      z-index: 60;
      top: 72px;
      right: 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      width: min(560px, calc(100vw - 32px));
      max-height: calc(100dvh - 88px);
      overflow-y: auto;
      scrollbar-gutter: stable;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 16px;
      background: rgba(7, 11, 24, 0.9);
      backdrop-filter: blur(28px) saturate(145%);
      -webkit-backdrop-filter: blur(28px) saturate(145%);
      box-shadow: 0 24px 70px rgba(0,0,0,0.52), inset 0 1px 0 rgba(255,255,255,0.1);
      transform-origin: 100% 0;
      animation: panel-in 0.2s ease both;
    }
    .appearance-panel[hidden] { display: none; }
    @keyframes panel-in {
      from { opacity: 0; transform: translateY(-8px) scale(0.97); }
      to { opacity: 1; transform: none; }
    }
    .appearance-head { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; }
    .appearance-head strong { font-size: 13px; letter-spacing: 0.04em; }
    .appearance-head span { color: var(--muted); font-size: 10px; }
    .appearance-group + .appearance-group { margin-top: 0; }
    .appearance-group.wide { grid-column: 1 / -1; }
    .appearance-group h3 {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.12em;
    }
    .choice-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    #skinChoices { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    #trailChoices { grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .choice {
      min-width: 0;
      padding: 5px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(255,255,255,0.035);
      cursor: pointer;
      font: inherit;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }
    .choice:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.28); }
    .choice[aria-pressed="true"] {
      color: var(--text);
      border-color: rgba(125,211,252,0.62);
      background: rgba(125,211,252,0.1);
      box-shadow: 0 0 18px rgba(56,189,248,0.14);
    }
    .choice b { display: block; margin-top: 5px; overflow: hidden; font-size: 12px; font-weight: 600; text-overflow: ellipsis; }
    .skin-swatch {
      display: block;
      height: 18px;
      border-radius: 6px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), inset 0 0 0 1px rgba(255,255,255,0.08);
    }
    .choice[data-value="auto"] .skin-swatch {
      position: relative; overflow: hidden;
      background:
        radial-gradient(circle at 88% 28%, #e7f2ff 0 1px, transparent 1.5px),
        radial-gradient(circle at 62% 76%, #a7c6e8 0 1px, transparent 1.5px),
        linear-gradient(112deg, #f8eed8 0 48%, #192947 49% 100%);
    }
    .choice[data-value="auto"] .skin-swatch::before {
      content: ""; position: absolute; left: 24%; top: 50%; width: 14px; height: 14px;
      border-radius: 50%; background: #edb44b; transform: translate(-50%, -50%);
      box-shadow: 0 0 0 3px rgba(237, 180, 75, .2), 0 0 12px rgba(237, 180, 75, .35);
    }
    .choice[data-value="auto"] .skin-swatch::after {
      content: ""; position: absolute; left: 78%; top: 38%; width: 16px; height: 16px;
      border-radius: 50%; transform: translate(-50%, -50%);
      box-shadow: -5px 3px 0 0 #e7f2ff;
    }
    .choice[data-value="aurora"] .skin-swatch { background: radial-gradient(circle at 25% 20%, #22d3ee, transparent 42%), radial-gradient(circle at 80% 75%, #a855f7, transparent 48%), #07101f; }
    .choice[data-value="cyber"] .skin-swatch { background: linear-gradient(135deg, transparent 38%, rgba(57,255,140,.8) 39% 42%, transparent 43%), radial-gradient(circle at 78% 34%, #ff2eb6, transparent 28%), #010704; }
    .choice[data-value="ember"] .skin-swatch { background: radial-gradient(circle at 52% 80%, #ff5a2a, transparent 48%), radial-gradient(circle at 20% 15%, #ffcf58, transparent 34%), #190704; }
    .choice[data-value="paper"] .skin-swatch { background: repeating-linear-gradient(8deg, rgba(90,70,40,.08) 0 1px, transparent 1px 7px), radial-gradient(circle at 75% 22%, #d6a66c, transparent 36%), #efe4cc; }
    .choice[data-value="nebula"] .skin-swatch { background: radial-gradient(circle at 72% 24%, #f0abfc 0 2%, transparent 3%), radial-gradient(circle at 68% 40%, #7c3aed, transparent 36%), radial-gradient(circle at 22% 70%, #2563eb, transparent 42%), #05051a; }
    .choice[data-value="prism"] .skin-swatch { background: conic-gradient(from 210deg at 52% 48%, #07111f, #0ea5e9, #8b5cf6, #ec4899, #07111f); }
    .choice[data-value="obsidian"] .skin-swatch { background: radial-gradient(circle at 70% 28%, #eabf67, transparent 22%), linear-gradient(145deg, #252019, #050505 58%, #3a2b15); }
    .choice[data-value="abyss"] .skin-swatch { background: radial-gradient(circle at 20% 26%, #67e8f9, transparent 24%), radial-gradient(circle at 76% 74%, #14b8a6, transparent 34%), linear-gradient(160deg, #06283c, #010811); }
    .choice[data-value="snow"] .skin-swatch { background: radial-gradient(circle at 25% 20%, #dbe7f7, transparent 46%), radial-gradient(circle at 78% 76%, #d3c9ec, transparent 50%), #f4f7fb; }
    .choice[data-value="sakura"] .skin-swatch { background: radial-gradient(circle at 25% 20%, #ffd7e6, transparent 46%), radial-gradient(circle at 78% 76%, #ffe4d1, transparent 50%), #fdf1f5; }
    .choice[data-value="celadon"] .skin-swatch { background: radial-gradient(circle at 25% 20%, #cdeade, transparent 46%), radial-gradient(circle at 78% 76%, #d2ecf4, transparent 50%), #f0f7f3; }

    .choice[data-value="shuimo"] .skin-swatch { background: url("themes/shuimo.svg?v=svg2") center 55% / cover; }
    .choice[data-value="daiqing"] .skin-swatch { background: url("themes/daiqing.svg?v=svg2") center 55% / cover; }
    .choice[data-value="zhusha"] .skin-swatch { background: url("themes/zhusha.svg?v=svg2") center 55% / cover; }
    .choice[data-value="yemo"] .skin-swatch { background: url("themes/yemo.svg?v=svg2") center 55% / cover; }

    .icon-swatch {
      position: relative;
      display: grid;
      width: 24px;
      height: 24px;
      margin: auto;
      place-items: center;
      border-radius: 7px;
      color: #fff;
      background: linear-gradient(145deg, #0ea5e9, #6d28d9);
      box-shadow: 0 0 14px rgba(56,189,248,0.25), inset 0 1px 0 rgba(255,255,255,0.35);
      font-size: 12px;
      font-weight: 800;
    }
    .choice[data-value="letter"] .icon-swatch { background: linear-gradient(145deg, #2563eb, #312e81); }
    .choice[data-value="glass"] .icon-swatch { background: linear-gradient(145deg, rgba(255,255,255,.38), rgba(56,189,248,.15)); border: 1px solid rgba(255,255,255,.5); backdrop-filter: blur(5px); }
    .choice[data-value="neon"] .icon-swatch { border-radius: 50%; background: #07101f; box-shadow: 0 0 4px #22d3ee, 0 0 13px #a855f7, inset 0 0 8px #22d3ee; }
    .choice[data-value="gem"] .icon-swatch { transform: rotate(45deg) scale(.75); border-radius: 8px; }
    .choice[data-value="gem"] .icon-swatch i { transform: rotate(-45deg); }
    .choice[data-value="holo"] .icon-swatch { background: linear-gradient(135deg, #67e8f9, #818cf8 45%, #f0abfc); clip-path: polygon(12% 0,88% 0,100% 25%,78% 100%,22% 100%,0 25%); }
    .choice[data-value="mono"] .icon-swatch { color: #dce7f7; background: transparent; border: 1px solid #8fa0c4; box-shadow: inset 0 0 0 3px rgba(143,160,196,.08); }
    .choice[data-value="pixel"] .icon-swatch { border-radius: 2px; background: #06120d; border: 2px solid #39ff8c; box-shadow: 4px 4px 0 rgba(255,46,182,.65); font-family: Consolas, monospace; }
    .layout-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .motion-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .layout-swatch {
      display: grid;
      width: 40px;
      height: 20px;
      margin: 1px auto 0;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
    }
    .layout-swatch i {
      min-width: 0;
      border: 1px solid rgba(125,211,252,0.48);
      border-radius: 3px;
      background: linear-gradient(145deg, rgba(125,211,252,.42), rgba(168,85,247,.18));
    }
    .choice[data-value="compact"] .layout-swatch { grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .choice[data-value="list"] .layout-swatch { grid-template-columns: 1fr; }
    .motion-swatch {
      display: block;
      width: 64px;
      height: 56px;
      margin: auto;
    }
    .motion-swatch svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .motion-swatch .motion-anim { transform-box: fill-box; transform-origin: center; }
    .motion-swatch .motion-swing { transform-box: view-box; transform-origin: 50% 14%; }
    .choice:is(:hover, :focus-visible, [aria-pressed="true"]) .motion-lift { animation: motion-preview-float 1.4s ease-in-out infinite alternate; }
    .choice:is(:hover, :focus-visible, [aria-pressed="true"]) .motion-breathe { animation: motion-preview-pulse 1.3s ease-in-out infinite alternate; }
    .choice:is(:hover, :focus-visible, [aria-pressed="true"]) .motion-shine { animation: motion-preview-sweep 1.8s ease-in-out infinite; }
    .choice:is(:hover, :focus-visible, [aria-pressed="true"]) .motion-swing { animation: motion-preview-sway 1.4s ease-in-out infinite; }
    .choice:is(:hover, :focus-visible, [aria-pressed="true"]) .motion-ball { animation: motion-preview-bounce 1.2s ease-in-out infinite; }
    .choice:is(:hover, :focus-visible, [aria-pressed="true"]) .motion-turn { animation: motion-preview-spin 2.4s ease-in-out infinite; }
    .choice:is(:hover, :focus-visible, [aria-pressed="true"]) .motion-wave { animation: motion-preview-ripple 1.6s ease-out infinite; }
    .choice:is(:hover, :focus-visible, [aria-pressed="true"]) .motion-wave-late { animation-delay: -.8s; }
    @keyframes motion-preview-float { to { transform: translateY(-4px); } }
    @keyframes motion-preview-pulse { to { transform: scale(1.12); opacity: .72; } }
    @keyframes motion-preview-sweep {
      0%, 15% { transform: translateX(-9px); opacity: .25; }
      50% { opacity: 1; }
      85%, 100% { transform: translateX(12px); opacity: .25; }
    }
    @keyframes motion-preview-sway {
      0%, 70%, 100% { transform: rotate(0); }
      15% { transform: rotate(-15deg); }
      32% { transform: rotate(12deg); }
      50% { transform: rotate(-7deg); }
    }
    @keyframes motion-preview-bounce {
      0%, 65%, 100% { transform: translateY(0) scale(1); }
      12% { transform: translateY(2px) scale(1.08,.9); }
      32% { transform: translateY(-8px) scale(.96,1.04); }
      50% { transform: translateY(2px) scale(1.1,.9); }
    }
    @keyframes motion-preview-spin { 0%, 10% { transform: rotate(0); } 85%, 100% { transform: rotate(360deg); } }
    @keyframes motion-preview-ripple {
      from { transform: scale(.72); opacity: .8; }
      to { transform: scale(1.12); opacity: .25; }
    }
    .trail-swatch {
      display: grid;
      width: 24px;

    html[data-motion="float"] .card:is(:hover, :focus-visible) .ico {
      animation: icon-float .62s cubic-bezier(.2,.85,.3,1.2) both;
    }
    html[data-motion="pulse"] .card:is(:hover, :focus-visible) .ico {
      animation: icon-breathe .9s ease-in-out infinite alternate;
    }
    html[data-motion="sweep"] .ico::before {
      content: "";
      position: absolute;
      z-index: 4;
      inset: -25% auto -25% -50%;
      width: 34%;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.74), transparent);
      filter: blur(2px);
      transform: skewX(-18deg);
      opacity: 0;
    }
    html[data-motion="sweep"] .card:is(:hover, :focus-visible) .ico::before {
      animation: icon-sweep .72s ease-out both;
    }
    html[data-motion="sway"] .card:is(:hover, :focus-visible) .ico {
      animation: icon-sway 1.4s ease-in-out infinite;
    }
    html[data-motion="bounce"] .card:is(:hover, :focus-visible) .ico {
      animation: icon-bounce 1.2s ease-in-out infinite;
    }
    html[data-motion="spin"] .card:is(:hover, :focus-visible) .ico {
      animation: icon-spin 1.8s cubic-bezier(.45,0,.2,1) infinite;
    }
    html[data-motion="ripple"] .ico::before {
      content: "";
      position: absolute;
      z-index: 4;
      inset: 12%;
      border: 1.5px solid hsla(var(--h),90%,85%,.9);
      border-radius: 50%;
      box-shadow: 0 0 6px hsla(var(--h),90%,75%,.6);
      pointer-events: none;
      opacity: 0;
    }
    html[data-motion="ripple"] .card:is(:hover, :focus-visible) .ico::before {
      animation: icon-ripple 1.2s ease-out infinite;
    }
    html[data-motion="still"] .card:hover .ico { animation: none; translate: none; }
    html[data-motion="still"]:not([data-icon="gem"]) .card:hover .ico img { transform: none; }
    html[data-motion="still"][data-icon="gem"] .card:hover .ico img { transform: rotate(-45deg) scale(1.2); }
    html[data-motion="still"][data-icon="pixel"] .card:hover .ico { transform: none; }
    html[data-motion="still"][data-icon="holo"] .card:is(:hover, :focus-visible) .ico::after {
      transform: translateX(-120%);
      transition: none;
    }
    @keyframes icon-float {
      0% { translate: 0 0; rotate: 0deg; }
      46% { translate: 0 -8px; rotate: 3deg; }
      72% { translate: 0 -3px; rotate: -1deg; }
      100% { translate: 0 -5px; rotate: 0deg; }
    }
    @keyframes icon-breathe {
      from { filter: brightness(1) drop-shadow(0 0 0 transparent); }
      to { filter: brightness(1.2) drop-shadow(0 0 10px hsla(var(--h), 90%, 68%, .72)); }
    }
    @keyframes icon-sweep {
      0% { left: -50%; opacity: 0; }
      18% { opacity: .9; }
      100% { left: 125%; opacity: 0; }
    }
    @keyframes icon-sway {
      0%, 70%, 100% { rotate: 0deg; }
      15% { rotate: -14deg; }
      30% { rotate: 11deg; }
      45% { rotate: -7deg; }
      58% { rotate: 4deg; }
    }
    @keyframes icon-bounce {
      0%, 65%, 100% { translate: 0 0; scale: 1; }
      12% { translate: 0 1px; scale: 1.08 .9; }
      30% { translate: 0 -8px; scale: .95 1.05; }
      48% { translate: 0 0; scale: 1.1 .9; }
      57% { translate: 0 -3px; scale: 1; }
    }
    @keyframes icon-spin {
      0%, 12% { rotate: 0deg; }
      78%, 100% { rotate: 360deg; }
    }
    @keyframes icon-ripple {
      0% { transform: scale(.25); opacity: 0; }
      18% { opacity: .9; }
      85%, 100% { transform: scale(1.8); opacity: 0; }
    }

    function buildTree(pathCounts) {

        const acc = [];
        for (const part of path.split("/")) {
          acc.push(part);
          if (!node.kids[part]) node.kids[part] = { name: part, path: acc.join("/"), count: 0, kids: {} };
          node = node.kids[part];
          node.count += count;

    function nodeAt(root, path) {
      let node = root;

            return { name: ip.city || ip.region || ip.country || "未知", lat: +ip.latitude, lon: +ip.longitude };
          }),
          fetchJson("https://ipwho.is/", 4000).then((ip) => {

            return { name: ip.city || ip.region || "未知", lat: ip.latitude, lon: ip.longitude };

    function weatherIcon(code) {

    const LIGHT_SKINS = new Set(["paper", "snow", "sakura", "celadon", "shuimo", "daiqing", "zhusha"]);

          fxCtx.rotate(p.rot);
          fxCtx.fillStyle = "hsla(338, 85%, 80%, " + (p.life * 0.8).toFixed(3) + ")";
          fxCtx.beginPath();
          fxCtx.ellipse(0, 0, p.r, p.r * 0.55, 0, 0, 6.29);
          fxCtx.fill();
          fxCtx.restore();
        } else if (p.kind === "sparkle") {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.rot += p.spin * dt;
          const radius = p.r * (0.45 + 0.55 * Math.sin(p.life * Math.PI));
          const gold = LIGHT_SKINS.has(document.documentElement.dataset.skin) ? "170, 105, 25" : "255, 219, 137";
          fxCtx.save();
          fxCtx.translate(p.x, p.y);
          fxCtx.rotate(p.rot);
          fxCtx.fillStyle = "rgba(" + gold + ", " + (p.life * 0.9).toFixed(3) + ")";
          fxCtx.shadowColor = "rgba(251, 191, 36, 0.55)";
          fxCtx.shadowBlur = radius;
          fxCtx.beginPath();
          for (let point = 0; point < 8; point++) {
            const angle = point * Math.PI / 4 - Math.PI / 2;
            const reach = point % 2 ? radius * 0.3 : radius;
            const px = Math.cos(angle) * reach, py = Math.sin(angle) * reach;
            if (point === 0) fxCtx.moveTo(px, py);
            else fxCtx.lineTo(px, py);
          }
          fxCtx.closePath();
          fxCtx.fill();
          fxCtx.restore();
        } else if (p.kind === "firefly") {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.ph += 0.16 * dt;
          const fa = p.life * (0.3 + 0.7 * Math.abs(Math.sin(p.ph)));
          fxCtx.fillStyle = "rgba(214, 255, 140, " + (fa * 0.22).toFixed(3) + ")";
          fxCtx.beginPath();
          fxCtx.arc(p.x, p.y, p.r * 2.6, 0, 6.29);
          fxCtx.fill();
          fxCtx.fillStyle = "rgba(232, 255, 170, " + (fa * 0.9).toFixed(3) + ")";
          fxCtx.beginPath();
          fxCtx.arc(p.x, p.y, p.r, 0, 6.29);
          fxCtx.fill();
        } else {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          fxCtx.fillStyle = p.kind === "rainbow"
            ? "hsla(" + p.hue.toFixed(0) + ", 95%, 72%, " + (p.life * 0.6).toFixed(3) + ")"
            : "rgba(" + ink + ", " + (p.life * 0.5).toFixed(3) + ")";
          fxCtx.beginPath();
          fxCtx.arc(p.x, p.y, Math.max(p.r * p.life, 0.2), 0, 6.29);
          fxCtx.fill();
        }
      }
      if (skyType || starTrail.length) skyRaf = requestAnimationFrame(skyFrame);
      else skyRunning = false;
    }
    function startSky() {
      if (skyRunning) return;
      skyRunning = true;
      skyLast = 0;
      skyRaf = requestAnimationFrame(skyFrame);
    }
    function syncParticles() {
      const run = motionOk();
      skyType = run ? skyClass(currentWeatherCode) : null;
      if (skyType !== populatedType) {
        skyPopulate();
        populatedType = skyType;
      }
      if (run && (skyType || starTrail.length)) {
        startSky();
      } else if (skyRunning) {
        skyRunning = false;
        cancelAnimationFrame(skyRaf);
        skyRaf = 0;
        starTrail.length = 0;
        fxCtx.clearRect(0, 0, innerWidth, innerHeight);
      }
    }
    window.addEventListener("resize", fxResize);
    fxResize();
    syncParticles();
    window.addEventListener("bm-fx", syncParticles);
    reduceMotionMq.addEventListener("change", syncParticles);

    const trailSizeInput = document.getElementById("trailSize");
    const trailSizeVal = document.getElementById("trailSizeVal");
    function setTrailSize(v, save) {
      trailScale = Math.round(Math.min(2.5, Math.max(0.5, v)) * 10) / 10;
      trailSizeInput.value = Math.round(trailScale * 100);
      trailSizeVal.textContent = trailScale.toFixed(1) + "×";
      if (save) {
        try { localStorage.setItem("bm-trail-size", String(trailScale)); } catch (e) {}
      }
    }
    setTrailSize(trailScale, false);
    trailSizeInput.addEventListener("input", () => setTrailSize(parseInt(trailSizeInput.value, 10) / 100, true));
    document.getElementById("trailSizeDown").addEventListener("click", () => setTrailSize(trailScale - 0.1, true));
    document.getElementById("trailSizeUp").addEventListener("click", () => setTrailSize(trailScale + 0.1, true));
    const skySizeInput = document.getElementById("skySize");
    const skySizeVal = document.getElementById("skySizeVal");
    const skyCountInput = document.getElementById("skyCount");
    const skyCountVal = document.getElementById("skyCountVal");
    function setSkySize(v, save) {
      skyScale = Math.round(Math.min(2.5, Math.max(0.5, v)) * 10) / 10;
      skySizeInput.value = Math.round(skyScale * 100);
      skySizeVal.textContent = skyScale.toFixed(1) + "×";
      if (save) {
        try { localStorage.setItem("bm-sky-size", String(skyScale)); } catch (e) {}
        skyPopulate();
      }
    }
    function setSkyCount(v, save) {
      skyCount = Math.round(Math.min(2.5, Math.max(0.25, v)) * 4) / 4;
      skyCountInput.value = Math.round(skyCount * 100);
      skyCountVal.textContent = skyCount.toFixed(2).replace(/0$/, "").replace(/\.$/, "") + "×";
      if (save) {
        try { localStorage.setItem("bm-sky-count", String(skyCount)); } catch (e) {}
        skyPopulate();
      }
    }
    setSkySize(skyScale, false);
    setSkyCount(skyCount, false);
    skySizeInput.addEventListener("input", () => setSkySize(parseInt(skySizeInput.value, 10) / 100, true));
    skyCountInput.addEventListener("input", () => setSkyCount(parseInt(skyCountInput.value, 10) / 100, true));
    document.getElementById("skySizeDown").addEventListener("click", () => setSkySize(skyScale - 0.1, true));
    document.getElementById("skySizeUp").addEventListener("click", () => setSkySize(skyScale + 0.1, true));
    document.getElementById("skyCountDown").addEventListener("click", () => setSkyCount(skyCount - 0.25, true));
    document.getElementById("skyCountUp").addEventListener("click", () => setSkyCount(skyCount + 0.25, true));
    tick();
    setInterval(tick, 10000);
    loadWeather(true);
    if (!ITEMS.length) {
      document.getElementById("main").innerHTML = '<div class="empty">暂无书签数据</div>';
    } else {
      render();
    }
  </script>
</body>
</html>
