<!DOCTYPE html>
<html lang="zh-CN" data-skin="aurora" data-icon="logo" data-layout="classic" data-motion="float" data-fx="on">
<head>
  <script>
    try {
      const url = new URL(location.href);
      if (url.searchParams.get("window") === "maximized") {
        try {
          window.moveTo(screen.availLeft, screen.availTop);
          window.resizeTo(screen.availWidth, screen.availHeight);
        } finally {
          url.searchParams.delete("window");
          history.replaceState(null, "", url.pathname + url.search + url.hash);
        }
      }
    } catch (e) {}
    try {
      let s = localStorage.getItem("bm-skin");
      if (s === "auto") s = matchMedia("(prefers-color-scheme: light)").matches ? "paper" : "aurora";
      const i = localStorage.getItem("bm-icon");
      const l = localStorage.getItem("bm-layout");
      const m = localStorage.getItem("bm-motion");
      const f = localStorage.getItem("bm-fx");
      if (s) document.documentElement.dataset.skin = s;
      if (i) document.documentElement.dataset.icon = i;
      if (l) document.documentElement.dataset.layout = l;
      if (m) document.documentElement.dataset.motion = m;
      if (f === "on" || f === "off") document.documentElement.dataset.fx = f;
      const fav = document.createElement("link");
      fav.rel = "icon";
      fav.id = "fav";
      fav.href = "/__favicon?skin=" + encodeURIComponent(s || "aurora");
      document.head.appendChild(fav);
    } catch (e) {}
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>书签</title>
  <style>
    :root {
      --text: #eef4ff;
      --muted: #8fa0c4;
      --glass: rgba(12, 18, 36, 0.58);
      --stroke: rgba(255, 255, 255, 0.12);
      --glow: rgba(86, 196, 255, 0.38);
      --bg: #040711;
      --radius: 18px;
      --radius-sm: 12px;
      --mx: 50%;
      --my: 18%;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    html { background: var(--bg); }
    body {
      margin: 0;
      color: var(--text);
      font: 15px/1.45 "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      background: transparent;
      overflow-x: hidden;
    }
    header, .layout { position: relative; z-index: 2; }
    .aurora {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(900px 520px at 8% -8%, rgba(56, 189, 248, 0.42), transparent 58%),
        radial-gradient(720px 480px at 92% 6%, rgba(168, 85, 247, 0.38), transparent 52%),
        radial-gradient(780px 520px at 70% 108%, rgba(34, 211, 238, 0.22), transparent 52%),
        linear-gradient(180deg, #07101f, #050814 42%, #03050c);
    }
    .aurora::before,
    .aurora::after {
      content: "";
      position: absolute;
      inset: -10%;
      pointer-events: none;
    }
    .aurora::before {
      background:
        radial-gradient(42vmax 28vmax at 18% 22%, rgba(59, 130, 246, 0.22), transparent 62%),
        radial-gradient(36vmax 24vmax at 82% 18%, rgba(217, 70, 239, 0.16), transparent 64%),
        radial-gradient(30vmax 22vmax at 58% 78%, rgba(45, 212, 191, 0.12), transparent 66%);
      animation: drift 10s ease-in-out infinite alternate;
    }
    .aurora::after {
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at 50% 28%, #000 18%, transparent 72%);
      opacity: 0.7;
    }
    .cursor-glow {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(420px 300px at var(--mx) var(--my), rgba(125, 211, 255, 0.32), transparent 55%),
        radial-gradient(180px 140px at var(--mx) var(--my), rgba(255, 255, 255, 0.12), transparent 45%);
    }
    @keyframes drift {
      from { transform: translate3d(-4%, -2%, 0) scale(1); }
      to { transform: translate3d(5%, 4%, 0) scale(1.12); }
    }
    #fx-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .bg-clock {
      position: fixed;
      right: 3vw;
      bottom: 1vh;
      z-index: 1;
      display: grid;
      justify-items: end;
      gap: 10px;
      pointer-events: none;
      user-select: none;
      color: var(--text);
      opacity: 0.055;
    }
    .bg-clock .bg-date {
      font-size: clamp(13px, 1.3vw, 17px);
      letter-spacing: 0.4em;
      margin-right: -0.4em;
    }
    .bg-clock .bg-time {
      font-size: clamp(110px, 20vw, 300px);
      font-weight: 700;
      line-height: 0.92;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    html[data-fx="on"] .aurora::before {
      translate: calc((var(--mx) - 50vw) * 0.045) calc((var(--my) - 50vh) * 0.045);
      transition: translate 1.1s cubic-bezier(0.16, 0.84, 0.44, 1);
    }
    html[data-fx="on"] .aurora::after {
      translate: calc((var(--mx) - 50vw) * -0.02) calc((var(--my) - 50vh) * -0.02);
      transition: translate 1.4s cubic-bezier(0.16, 0.84, 0.2, 1);
    }
    html[data-fx="on"] .aurora,
    html[data-fx="on"] #fx-canvas {
      transition: filter 0.45s ease, opacity 0.45s ease, transform 0.45s ease;
    }
    html[data-fx="on"] body.searching .aurora {
      filter: blur(7px) brightness(0.78) saturate(1.12);
      transform: scale(1.025);
    }
    html[data-fx="on"] body.searching #fx-canvas {
      opacity: 0.35;
    }
    header {
      display: grid;
      grid-template-columns: minmax(220px, auto) 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 22px 28px 10px;
    }
    .hello {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      height: 54px;
    }
    .hello .time {
      flex: 0 0 auto;
      font-size: 42px;
      font-weight: 720;
      letter-spacing: 0.06em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      background: linear-gradient(110deg, #f8fbff 10%, #7dd3fc 48%, #c084fc 92%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(125, 211, 252, 0.28));
    }
    .hello-meta {
      position: relative;
      display: grid;
      gap: 5px;
      min-width: 0;
      max-width: min(190px, 42vw);
      padding-left: 15px;
      white-space: nowrap;
    }
    .hello-meta::before {
      content: "";
      position: absolute;
      left: 0;
      top: 2px;
      bottom: 2px;
      width: 1px;
      background: linear-gradient(180deg, transparent, var(--glow) 22%, var(--stroke) 78%, transparent);
      box-shadow: 0 0 10px var(--glow);
    }
    .hello .greet {
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
      letter-spacing: 0.04em;
      text-overflow: ellipsis;
    }
    .weather {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      max-width: 100%;
      padding: 0;
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      line-height: 1.25;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-align: left;
    }
    .weather:hover { color: var(--text); }
    .weather .w-ico { display: inline-grid; place-items: center; flex: 0 0 auto; }
    .weather .w-ico svg { width: 14px; height: 14px; }
    .weather .w-txt {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .search {
      position: relative;
      max-width: 640px;
      margin: 0 auto;
      width: 100%;
    }
    .search::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 18px;
      background: linear-gradient(120deg, rgba(125,211,252,0.55), rgba(192,132,252,0.2), rgba(45,212,191,0.35));
      opacity: 0.35;
      z-index: -1;
      filter: blur(0.2px);
    }
    .search input {
      width: 100%;
      height: 54px;
      border: 1px solid var(--stroke);
      border-radius: calc(var(--radius) - 2px);
      padding: 0 18px 0 48px;
      color: var(--text);
      background: rgba(12, 18, 36, 0.42);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255,255,255,0.1);
      outline: none;
      font: inherit;
    }
    .search input:focus {
      border-color: rgba(125, 211, 252, 0.7);
      box-shadow: 0 0 0 4px var(--glow), 0 16px 48px rgba(0, 0, 0, 0.35);
    }
    .search-kbd {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      padding: 3px 8px;
      border: 1px solid var(--stroke);
      border-radius: 7px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      font-size: 11px;
      line-height: 1;
      letter-spacing: 0.08em;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .search input:focus ~ .search-kbd,
    .search input:not(:placeholder-shown) ~ .search-kbd { opacity: 0; }
    .search-ico {
      position: absolute;
      left: 16px;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .switch {
      cursor: pointer;
      font: inherit;
      color: var(--text);
    }
    .switch:hover { border-color: rgba(255,255,255,0.28); color: var(--text); }
    .switch b { font-weight: 650; }
    .switch i { font-style: normal; color: var(--muted); margin-right: 6px; font-size: 12px; }
    .appearance-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font: inherit;
      color: var(--text);
    }
    .appearance-trigger svg { width: 16px; height: 16px; color: #7dd3fc; }
    .appearance-trigger[aria-expanded="true"] {
      border-color: rgba(125, 211, 252, 0.55);
      box-shadow: 0 0 24px var(--glow), inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .appearance-panel {
      position: fixed;
      z-index: 60;
      top: 96px;
      right: 24px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      width: min(820px, calc(100vw - 48px));
      max-height: calc(100dvh - 120px);
      overflow-y: auto;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 20px;
      background: rgba(7, 11, 24, 0.9);
      backdrop-filter: blur(28px) saturate(145%);
      -webkit-backdrop-filter: blur(28px) saturate(145%);
      box-shadow: 0 24px 70px rgba(0,0,0,0.52), inset 0 1px 0 rgba(255,255,255,0.1);
      transform-origin: 100% 0;
      animation: panel-in 0.2s ease both;
    }
    .appearance-panel[hidden] { display: none; }
    @keyframes panel-in {
      from { opacity: 0; transform: translateY(-8px) scale(0.97); }
      to { opacity: 1; transform: none; }
    }
    .appearance-head { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; }
    .appearance-head strong { font-size: 15px; letter-spacing: 0.04em; }
    .appearance-head span { color: var(--muted); font-size: 11px; }
    .appearance-group + .appearance-group { margin-top: 0; }
    .appearance-group.wide { grid-column: 1 / -1; }
    .appearance-group h3 {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.12em;
    }
    .choice-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .choice {
      min-width: 0;
      padding: 7px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: var(--muted);
      background: rgba(255,255,255,0.035);
      cursor: pointer;
      font: inherit;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }
    .choice:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.28); }
    .choice[aria-pressed="true"] {
      color: var(--text);
      border-color: rgba(125,211,252,0.62);
      background: rgba(125,211,252,0.1);
      box-shadow: 0 0 18px rgba(56,189,248,0.14);
    }
    .choice b { display: block; margin-top: 5px; overflow: hidden; font-size: 11px; font-weight: 600; text-overflow: ellipsis; }
    .skin-swatch {
      display: block;
      height: 38px;
      border-radius: 8px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), inset 0 0 0 1px rgba(255,255,255,0.08);
    }
    .choice[data-value="aurora"] .skin-swatch { background: radial-gradient(circle at 25% 20%, #22d3ee, transparent 42%), radial-gradient(circle at 80% 75%, #a855f7, transparent 48%), #07101f; }
    .choice[data-value="cyber"] .skin-swatch { background: linear-gradient(135deg, transparent 38%, rgba(57,255,140,.8) 39% 42%, transparent 43%), radial-gradient(circle at 78% 34%, #ff2eb6, transparent 28%), #010704; }
    .choice[data-value="ember"] .skin-swatch { background: radial-gradient(circle at 52% 80%, #ff5a2a, transparent 48%), radial-gradient(circle at 20% 15%, #ffcf58, transparent 34%), #190704; }
    .choice[data-value="paper"] .skin-swatch { background: repeating-linear-gradient(8deg, rgba(90,70,40,.08) 0 1px, transparent 1px 7px), radial-gradient(circle at 75% 22%, #d6a66c, transparent 36%), #efe4cc; }
    .choice[data-value="nebula"] .skin-swatch { background: radial-gradient(circle at 72% 24%, #f0abfc 0 2%, transparent 3%), radial-gradient(circle at 68% 40%, #7c3aed, transparent 36%), radial-gradient(circle at 22% 70%, #2563eb, transparent 42%), #05051a; }
    .choice[data-value="prism"] .skin-swatch { background: conic-gradient(from 210deg at 52% 48%, #07111f, #0ea5e9, #8b5cf6, #ec4899, #07111f); }
    .choice[data-value="obsidian"] .skin-swatch { background: radial-gradient(circle at 70% 28%, #eabf67, transparent 22%), linear-gradient(145deg, #252019, #050505 58%, #3a2b15); }
    .choice[data-value="abyss"] .skin-swatch { background: radial-gradient(circle at 20% 26%, #67e8f9, transparent 24%), radial-gradient(circle at 76% 74%, #14b8a6, transparent 34%), linear-gradient(160deg, #06283c, #010811); }
    .icon-swatch {
      position: relative;
      display: grid;
      width: 38px;
      height: 38px;
      margin: auto;
      place-items: center;
      border-radius: 11px;
      color: #fff;
      background: linear-gradient(145deg, #0ea5e9, #6d28d9);
      box-shadow: 0 0 14px rgba(56,189,248,0.25), inset 0 1px 0 rgba(255,255,255,0.35);
      font-size: 14px;
      font-weight: 800;
    }
    .choice[data-value="letter"] .icon-swatch { background: linear-gradient(145deg, #2563eb, #312e81); }
    .choice[data-value="glass"] .icon-swatch { background: linear-gradient(145deg, rgba(255,255,255,.38), rgba(56,189,248,.15)); border: 1px solid rgba(255,255,255,.5); backdrop-filter: blur(5px); }
    .choice[data-value="neon"] .icon-swatch { border-radius: 50%; background: #07101f; box-shadow: 0 0 4px #22d3ee, 0 0 13px #a855f7, inset 0 0 8px #22d3ee; }
    .choice[data-value="gem"] .icon-swatch { transform: rotate(45deg) scale(.75); border-radius: 8px; }
    .choice[data-value="gem"] .icon-swatch i { transform: rotate(-45deg); }
    .choice[data-value="holo"] .icon-swatch { background: linear-gradient(135deg, #67e8f9, #818cf8 45%, #f0abfc); clip-path: polygon(12% 0,88% 0,100% 25%,78% 100%,22% 100%,0 25%); }
    .choice[data-value="mono"] .icon-swatch { color: #dce7f7; background: transparent; border: 1px solid #8fa0c4; box-shadow: inset 0 0 0 3px rgba(143,160,196,.08); }
    .choice[data-value="pixel"] .icon-swatch { border-radius: 2px; background: #06120d; border: 2px solid #39ff8c; box-shadow: 4px 4px 0 rgba(255,46,182,.65); font-family: Consolas, monospace; }
    .layout-grid { grid-template-columns: repeat(3, 1fr); }
    .motion-grid { grid-template-columns: repeat(4, 1fr); }
    .layout-swatch {
      display: grid;
      width: 52px;
      height: 34px;
      margin: 2px auto 0;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
    }
    .layout-swatch i {
      min-width: 0;
      border: 1px solid rgba(125,211,252,0.48);
      border-radius: 3px;
      background: linear-gradient(145deg, rgba(125,211,252,.42), rgba(168,85,247,.18));
    }
    .choice[data-value="compact"] .layout-swatch { grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .choice[data-value="list"] .layout-swatch { grid-template-columns: 1fr; }
    .motion-swatch {
      position: relative;
      display: grid;
      width: 40px;
      height: 34px;
      margin: 2px auto 0;
      place-items: center;
    }
    .motion-swatch i {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: linear-gradient(145deg, #22d3ee, #7c3aed 65%, #ec4899);
      box-shadow: 0 0 12px rgba(56,189,248,.36);
    }
    .choice[data-value="float"][aria-pressed="true"] .motion-swatch i { animation: motion-preview-float 1.4s ease-in-out infinite alternate; }
    .choice[data-value="pulse"][aria-pressed="true"] .motion-swatch i { animation: motion-preview-pulse 1.2s ease-in-out infinite alternate; }
    .choice[data-value="sweep"] .motion-swatch { overflow: hidden; border-radius: 8px; }
    .choice[data-value="sweep"] .motion-swatch::after {
      content: "";
      position: absolute;
      inset: 2px auto 2px -15px;
      width: 10px;
      background: rgba(255,255,255,.72);
      filter: blur(3px);
      transform: skewX(-18deg);
      opacity: 0;
    }
    .choice[data-value="sweep"][aria-pressed="true"] .motion-swatch::after { animation: motion-preview-sweep 1.6s ease-in-out infinite; }
    .choice[data-value="still"] .motion-swatch i { background: linear-gradient(145deg, #64748b, #1e293b); box-shadow: none; }
    @keyframes motion-preview-float { to { transform: translateY(-5px) rotate(4deg); } }
    @keyframes motion-preview-pulse { to { filter: brightness(1.3); box-shadow: 0 0 18px rgba(192,132,252,.72); } }
    @keyframes motion-preview-sweep { 0%, 20% { left: -15px; opacity: 0; } 34%, 68% { opacity: 1; } 70%, 100% { left: 48px; opacity: 0; } }
    .fx-grid { grid-template-columns: repeat(2, 1fr); }
    .fx-grid .choice { display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; }
    .fx-grid .choice b { margin: 0; }
    .fx-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .choice[data-value="on"] .fx-dot { background: #39ff8c; box-shadow: 0 0 10px #39ff8c; }
    .appearance-note { grid-column: 1 / -1; margin: 0 2px; color: var(--muted); font-size: 11px; }
    .stat {
      padding: 9px 13px;
      color: var(--muted);
      white-space: nowrap;
      border: 1px solid var(--stroke);
      background: rgba(12, 18, 36, 0.42);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 999px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .layout {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      padding: 8px 20px 40px;
    }
    .nav-cols {
      display: flex;
      gap: 8px;
      align-items: start;
      position: sticky;
      top: 12px;
    }
    .nav-col {
      width: max-content;
      min-width: 148px;
      max-height: calc(100vh - 24px);
      overflow-y: auto;
      padding: 10px;
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(10, 16, 32, 0.42));
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .folder {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
    }
    .folder::after {
      content: "|";
      order: 3;
      width: 0.7em;
      color: var(--muted);
      font-weight: 500;
      text-align: center;
      opacity: 0.55;
    }
    .folder.has-kids::after {
      content: "\203A";
      opacity: 1;
    }
    .folder:hover { background: rgba(255,255,255,0.06); }
    .folder.on {
      background: linear-gradient(90deg, hsla(var(--h), 80%, 64%, 0.22), rgba(255,255,255,0.04));
      box-shadow: inset 0 0 0 1px hsla(var(--h), 80%, 64%, 0.35), 0 0 18px hsla(var(--h), 80%, 64%, 0.12);
    }
    .folder b {
      flex: 0 0 2.8em;
      width: 2.8em;
      font-style: normal;
      font-weight: 500;
      text-align: justify;
      text-align-last: justify;
    }
    .folder em { font-style: normal; font-weight: 500; }
    .folder span {
      order: 4;
      min-width: 28px;
      text-align: center;
      color: var(--muted);
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      font-size: 12px;
      padding: 1px 7px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: hsl(var(--h), 80%, 64%);
      box-shadow: 0 0 10px hsl(var(--h), 80%, 64%);
      flex: 0 0 auto;
    }

      gap: 12px;

    .card {
      position: relative;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      min-height: 88px;
      padding: 14px;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.12), rgba(12, 18, 34, 0.48));

      overflow: hidden;
      animation: rise 0.42s ease backwards;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .card > div:last-child { min-width: 0; flex: 1; }
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 28%, hsla(var(--h), 90%, 72%, 0.16) 50%, transparent 72%);
      transform: translateX(-120%);
      transition: transform 0.55s ease;

    .card-glow {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(240px circle at var(--gx, 50%) var(--gy, 50%), hsla(var(--h), 90%, 74%, 0.16), transparent 62%);
      transition: opacity 0.3s ease;
    }

    .ripple {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 26px;
      height: 26px;
      margin: -13px 0 0 -13px;
      border-radius: 50%;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(circle, hsla(var(--h), 90%, 74%, 0.5), hsla(var(--h), 90%, 74%, 0) 65%);
      animation: ripple-out 0.55s ease-out both;

    @keyframes ripple-out {

    @keyframes rise {

      to { opacity: 1; transform: none; }

    html[data-motion="float"] .card:is(:hover, :focus-visible) .ico {

    html[data-motion="pulse"] .card:is(:hover, :focus-visible) .ico {
      animation: icon-breathe .9s ease-in-out infinite alternate;

    html[data-motion="sweep"] .ico::before {
      content: "";
      position: absolute;
      z-index: 4;
      inset: -25% auto -25% -50%;
      width: 34%;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.74), transparent);
      filter: blur(2px);
      transform: skewX(-18deg);
      opacity: 0;

    html[data-motion="sweep"] .card:is(:hover, :focus-visible) .ico::before {

    html[data-motion="still"] .card:hover .ico { animation: none; translate: none; }
    html[data-motion="still"]:not([data-icon="gem"]) .card:hover .ico img { transform: none; }

    html[data-motion="still"][data-icon="holo"] .card:is(:hover, :focus-visible) .ico::after {
      transform: translateX(-120%);
      transition: none;
    }
    @keyframes icon-float {
      0% { translate: 0 0; rotate: 0deg; }
      46% { translate: 0 -8px; rotate: 3deg; }
      72% { translate: 0 -3px; rotate: -1deg; }
      100% { translate: 0 -5px; rotate: 0deg; }

    @keyframes icon-breathe {
      from { filter: brightness(1) drop-shadow(0 0 0 transparent); }
      to { filter: brightness(1.2) drop-shadow(0 0 10px hsla(var(--h), 90%, 68%, .72)); }
    }
    @keyframes icon-sweep {

    .card:focus-visible,

      .ico::before,
      .motion-swatch i,

      .aurora::before,

      html[data-fx="on"] .card,

      }

      }
    }

  <header>

      <div id="clock" class="time">--:--</div>

  <script>
    const dataVersion = new URLSearchParams(window.location.search).get("v") || "";

  </script>
  <script>
    const SKINS = [
      { id: "auto", name: "自动" },
      { id: "aurora", name: "极光" },
      { id: "cyber", name: "赛博" },
      { id: "ember", name: "余烬" },
      { id: "paper", name: "宣纸" },
      { id: "nebula", name: "星海" },
      { id: "prism", name: "幻彩" },
      { id: "obsidian", name: "墨金" },
      { id: "abyss", name: "深海" }
    ];
    const ICONS = [
      { id: "logo", name: "原始" },
      { id: "letter", name: "字母" },
      { id: "glass", name: "玻璃" },
      { id: "neon", name: "霓虹" },
      { id: "gem", name: "晶体" },
      { id: "holo", name: "全息" },
      { id: "mono", name: "单色" },
      { id: "pixel", name: "像素" }

    const FX = [

    const LAYOUTS = [
      { id: "classic", name: "标准" },

      { id: "list", name: "列表" }
    ];
    const MOTIONS = [
      { id: "float", name: "悬浮" },
      { id: "pulse", name: "呼吸" },
      { id: "sweep", name: "流光" },
      { id: "still", name: "静止" }
    ];
    const PAGE = 36;
    let savedFolder = null;
    try { savedFolder = localStorage.getItem("bm-folder"); } catch (e) {}
    const state = { folder: savedFolder === null ? "常用" : savedFolder, q: "", shown: PAGE };
    const reduceMotionMq = matchMedia("(prefers-reduced-motion: reduce)");
    const motionOk = () => document.documentElement.dataset.fx !== "off" && !reduceMotionMq.matches;
    const autoSkin = () => (matchMedia("(prefers-color-scheme: light)").matches ? "paper" : "aurora");
    function choicePreview(key) {
      if (key === "skin") return '<span class="skin-swatch"></span>';
      if (key === "icon") return '<span class="icon-swatch"><i>A</i></span>';
      if (key === "layout") return '<span class="layout-swatch"><i></i><i></i><i></i><i></i><i></i><i></i></span>';
      if (key === "motion") return '<span class="motion-swatch"><i></i></span>';
      return '<span class="fx-dot"></span>';
    }
    function setupChoice(list, key, containerId, resolve) {
      const root = document.documentElement;
      let stored = null;
      try { stored = localStorage.getItem("bm-" + key); } catch (e) {}
      const cur = stored && list.some((x) => x.id === stored)
        ? stored
        : root.dataset[key] || list[0].id;
      const container = document.getElementById(containerId);
      container.innerHTML = list.map((item) => `
        <button type="button" class="choice" data-value="${item.id}" aria-pressed="false">
          ${choicePreview(key)}<b>${item.name}</b>
        </button>`).join("");
      const apply = (id, syncShortcut = false) => {
        const item = list.find((x) => x.id === id) || list[0];
        root.dataset[key] = resolve ? resolve(item.id) : item.id;
        try { localStorage.setItem("bm-" + key, item.id); } catch (e) {}
        for (const btn of container.querySelectorAll(".choice")) {
          btn.setAttribute("aria-pressed", String(btn.dataset.value === item.id));
        }
        if (key === "skin") {
          const fav = document.getElementById("fav");
          if (fav) fav.href = "/__favicon?skin=" + encodeURIComponent(root.dataset.skin);
          document.getElementById("appearanceLabel").textContent = "外观 · " + item.name;
          if (syncShortcut) fetch("/__icon?skin=" + encodeURIComponent(root.dataset.skin)).catch(() => {});
        }
        if (key === "fx") window.dispatchEvent(new Event("bm-fx"));
      };
      apply(list.some((x) => x.id === cur) ? cur : list[0].id);
      container.addEventListener("click", (event) => {
        const btn = event.target.closest(".choice");
        if (!btn) return;
        apply(btn.dataset.value, key === "skin");
      });
    }

    const PIN = ["常用", "公司", "AI", "工具", "平台", "技术", "社区", "资讯", "财经", "影音", "其他"];
    const ITEMS = (window.BOOKMARKS || []).map((it) => ({
      ...it,
      search: [it.title, it.href, it.path, it.group, it.host].join(" ").toLowerCase(),
      hue: hue(it.host || it.path)
    }));

    function hue(text) {
      let h = 0;
      for (const ch of String(text)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return h % 360;
    }
    function sortNames(names, counts) {
      return [...names].sort((a, b) => {
        const pa = PIN.indexOf(a), pb = PIN.indexOf(b);
        if (pa !== -1 || pb !== -1) return (pa === -1 ? 99 : pa) - (pb === -1 ? 99 : pb);
        return (counts.get(b) || 0) - (counts.get(a) || 0) || a.localeCompare(b, "zh");
      });
    }
    function inFolder(item) {
      if (!state.folder) return true;
      return item.path === state.folder || item.path.startsWith(state.folder + "/") || item.group === state.folder;
    }
    function hitSearch(item) {
      const q = state.q.trim().toLowerCase();
      if (!q) return true;
      return item.search.includes(q);
    }
    function matches(item) { return inFolder(item) && hitSearch(item); }
    function sectionKey(item) {
      if (!state.folder) return item.group;
      if (item.path === state.folder) return item.path;
      const rest = item.path.startsWith(state.folder + "/")
        ? item.path.slice(state.folder.length + 1)
        : item.path;
      const next = rest.split("/")[0];
      return next ? state.folder + "/" + next : item.path;
    }
    function buildTree(pathCounts) {
      const root = { kids: {} };
      for (const [path, count] of pathCounts) {
        let node = root;
        const acc = [];
        for (const part of path.split("/")) {
          acc.push(part);
          if (!node.kids[part]) node.kids[part] = { name: part, path: acc.join("/"), count: 0, kids: {} };
          node = node.kids[part];
          node.count += count;
        }
      }
      return root;
    }
    function nodeAt(root, path) {
      let node = root;
      if (!path) return node;
      for (const part of path.split("/")) {
        node = node.kids[part];
        if (!node) return null;
      }
      return node;
    }
    function openColumns(folder, tree) {
      const cols = [""];
      if (!folder) return cols;
      const acc = [];
      for (const part of folder.split("/")) {
        acc.push(part);
        const path = acc.join("/");
        const node = nodeAt(tree, path);
        if (node && Object.keys(node.kids).length) cols.push(path);
      }
      return cols;
    }
    const WMO = {
      0: "晴", 1: "晴间多云", 2: "多云", 3: "阴",
      45: "雾", 48: "雾凇",
      51: "小毛毛雨", 53: "毛毛雨", 55: "大毛毛雨",
      56: "冻毛毛雨", 57: "冻毛毛雨",
      61: "小雨", 63: "中雨", 65: "大雨",
      66: "冻雨", 67: "冻雨",
      71: "小雪", 73: "中雪", 75: "大雪", 77: "雪粒",
      80: "小阵雨", 81: "阵雨", 82: "强阵雨",
      85: "小阵雪", 86: "阵雪",
      95: "雷雨", 96: "雷雨冰雹", 99: "强雷雨冰雹"
    };
    function readJson(key) {
      try { return JSON.parse(localStorage.getItem(key) || "null"); } catch { return null; }
    }
    function writeJson(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }
    function fetchJson(url, ms) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms);
      return fetch(url, { signal: ctrl.signal }).then((r) => r.json()).finally(() => clearTimeout(timer));
    }
    async function locateCity() {
      const saved = readJson("bm-city");
      if (saved && saved.lat && saved.lon) return saved;
      try {
        const city = await Promise.any([
          fetchJson("https://get.geojs.io/v1/ip/geo.json", 4000).then((ip) => {
            if (ip.latitude == null || ip.longitude == null) throw new Error("geojs");
            return { name: ip.city || ip.region || ip.country || "未知", lat: +ip.latitude, lon: +ip.longitude };
          }),
          fetchJson("https://ipwho.is/", 4000).then((ip) => {
            if (!ip.success || ip.latitude == null || ip.longitude == null) throw new Error("ipwho");
            return { name: ip.city || ip.region || "未知", lat: ip.latitude, lon: ip.longitude };
          })
        ]);
        writeJson("bm-city", city);
        return city;
      } catch (e) {
        return { name: "北京", lat: 39.9, lon: 116.4 };
      }
    }
    async function searchCity(name) {
      const geo = await fetch(
        "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(name) + "&count=1&language=zh"
      ).then((r) => r.json());
      const hit = geo.results && geo.results[0];
      if (!hit) return null;
      return { name: hit.name, lat: hit.latitude, lon: hit.longitude };
    }
    const W_ICONS = {
      sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5V5M12 19v2.5M2.5 12H5M19 12h2.5M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M19.2 4.8l-1.7 1.7M6.5 17.5l-1.7 1.7"/>',
      moon: '<path d="M20.2 13.6A8.2 8.2 0 0 1 10.4 3.8a8.2 8.2 0 1 0 9.8 9.8Z"/>',
      cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
      cloudsun: '<circle cx="6.5" cy="6" r="2.4"/><path d="M6.5 1.6v1.3M1.7 6h1.3M3.1 2.6l.9.9"/><path d="M17.5 20H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
      cloudmoon: '<path d="M7.4 6.4A3.4 3.4 0 0 1 3 2a3.4 3.4 0 1 0 4.4 4.4Z"/><path d="M17.5 20H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
      rain: '<path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24"/><path d="M16 14v5M8 14v5M12 16v5"/>',
      snow: '<path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24"/><path d="M8 15h.01M8 19h.01M12 17h.01M12 21h.01M16 15h.01M16 19h.01"/>',
      bolt: '<path d="M6 16.3A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.97"/><path d="m13 12-3 5h4l-3 5"/>',
      fog: '<path d="M17.5 16H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="M5 20h14M8 23h8"/>',
      pin: '<path d="M12 21s-6.5-5.4-6.5-10.2a6.5 6.5 0 1 1 13 0C18.5 15.6 12 21 12 21Z"/><circle cx="12" cy="10.5" r="2.3"/>'
    };
    function weatherIcon(code) {
      const h = new Date().getHours();
      const night = h >= 19 || h < 6;
      let k = "pin";
      if (code != null) {
        if (code === 0) k = night ? "moon" : "sun";
        else if (code === 1 || code === 2) k = night ? "cloudmoon" : "cloudsun";
        else if (code === 3) k = "cloud";
        else if (code === 45 || code === 48) k = "fog";
        else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) k = "rain";
        else if ((code >= 71 && code <= 77) || code === 85 || code === 86) k = "snow";
        else if (code >= 95) k = "bolt";
      }
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + W_ICONS[k] + "</svg>";
    }
    function setWeatherUI(text, code) {
      document.getElementById("weatherIco").innerHTML = weatherIcon(code);
      document.getElementById("weatherTxt").textContent = text;
    }
    async function loadWeather(quiet) {
      const cache = readJson("bm-weather");
      if (cache && cache.text && Date.now() - cache.at < 20 * 60 * 1000) {
        currentWeatherCode = cache.code;
        setWeatherUI(cache.text, cache.code);
        syncParticles();
        return;
      }
      try {
        const city = await locateCity();
        const data = await fetch(
          "https://api.open-meteo.com/v1/forecast?latitude=" + city.lat +
          "&longitude=" + city.lon +
          "&current=temperature_2m,weather_code&timezone=auto"
        ).then((r) => r.json());
        const code = data.current.weather_code;
        const t = Math.round(data.current.temperature_2m);
        const desc = WMO[code] || "天气";
        const text = desc + " " + t + "° · " + city.name;
        currentWeatherCode = code;
        setWeatherUI(text, code);
        writeJson("bm-weather", { text, at: Date.now(), code });
      } catch (e) {
        if (!quiet) setWeatherUI("点击设置城市", null);
      }
      syncParticles();
    }

    const clockEl = document.getElementById("clock");
    clockEl.innerHTML = "--:--".split("").map((c) => "<span>" + c + "</span>").join("");
    let clockReady = false;
    function rollDigit(span, ch) {
      const out = span.animate(
        [{ transform: "translateY(0)", opacity: 1 }, { transform: "translateY(-58%)", opacity: 0 }],
        { duration: 105, easing: "ease-in", fill: "forwards" }
      );
      out.onfinish = () => {
        span.textContent = ch;
        span.animate(
          [{ transform: "translateY(58%)", opacity: 0 }, { transform: "translateY(0)", opacity: 1 }],
          { duration: 170, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)", fill: "forwards" }
        );
      };
    }
    function setClock(str, roll) {
      for (let i = 0; i < str.length; i++) {
        const span = clockEl.children[i];
        if (!span || span.textContent === str[i]) continue;
        if (roll && motionOk()) rollDigit(span, str[i]);
        else span.textContent = str[i];
      }
    }
    function tick() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      setClock(hh + ":" + mm, clockReady);
      clockReady = true;
      const dateStr = now.toLocaleDateString("zh-CN", { weekday: "long", month: "long", day: "numeric" });
      document.getElementById("bgTime").textContent = hh + ":" + mm;
      document.getElementById("bgDate").textContent = dateStr;
      const h = now.getHours();
      const greet = h < 5 ? "夜深了" : h < 11 ? "早上好" : h < 14 ? "中午好" : h < 18 ? "下午好" : h < 22 ? "晚上好" : "夜深了";
      document.getElementById("greet").textContent = dateStr + " · " + greet;
    }

    function cardHtml(item) {
      const h = item.hue;
      const letter = (item.title || item.host || "?").trim().charAt(0).toUpperCase();
      const sub = item.path.includes("/") ? item.path.slice(item.path.indexOf("/") + 1) : "";
      return `
        <a class="card" style="--h:${h}" href="${item.href}" target="_blank" rel="noreferrer" data-key="${escapeHtml(item.href)}">
          <div class="ico">
            <span>${escapeHtml(letter)}</span>
            <img src="https://t1.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://${encodeURIComponent(item.host)}&size=64" alt="" loading="lazy" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='https://icons.duckduckgo.com/ip3/${encodeURIComponent(item.host)}.ico'}else this.remove()">
          </div>
          <div>
            <h3>${escapeHtml(item.title)}</h3>
            <p>${escapeHtml(item.host)}</p>
            <div class="meta">
              ${sub && state.folder.split("/").length < 2 ? `<span class="tag">${escapeHtml(sub)}</span>` : ""}
              ${item.href.startsWith("http://") ? '<span class="tag">http</span>' : ""}
            </div>
          </div>
          <i class="card-glow" aria-hidden="true"></i>
        </a>`;
    }
    function selectedInCol(colPath, itemPath) {
      if (!state.folder) return itemPath === "";
      if (itemPath === "") return false;
      return state.folder === itemPath || state.folder.startsWith(itemPath + "/");
    }
    let flipSnapshot = null;
    function snapshotFlips() {
      flipSnapshot = null;
      if (!motionOk()) return;
      const cards = document.querySelectorAll("#main [data-key]");
      if (!cards.length || cards.length > 300) return;
      const map = new Map();
      for (const el of cards) {
        const r = el.getBoundingClientRect();
        if (r.width || r.height) map.set(el.dataset.key, { x: r.left, y: r.top });
      }
      flipSnapshot = map;
    }
    function applyFlips() {
      const map = flipSnapshot;
      flipSnapshot = null;
      if (!map) return;
      for (const el of document.querySelectorAll("#main [data-key]")) {
        const old = map.get(el.dataset.key);
        if (!old) continue;
        const r = el.getBoundingClientRect();
        const dx = old.x - r.left;
        const dy = old.y - r.top;
        if (Math.abs(dx) < 2 && Math.abs(dy) < 2) continue;
        el.style.animation = "none";
        el.animate(
          [{ transform: "translate(" + dx.toFixed(1) + "px, " + dy.toFixed(1) + "px)" }, { transform: "none" }],
          { duration: 380, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)" }
        );
      }
    }
    function render() {
      snapshotFlips();
      const searched = ITEMS.filter(hitSearch);
      const visible = searched.filter(matches);
      const groupCounts = new Map();
      const pathCounts = new Map();
      for (const item of searched) {
        groupCounts.set(item.group, (groupCounts.get(item.group) || 0) + 1);
        pathCounts.set(item.path, (pathCounts.get(item.path) || 0) + 1);
      }
      const tree = buildTree(pathCounts);
      const cols = openColumns(state.folder, tree);

      document.getElementById("nav").innerHTML = cols.map((colPath) => {
        const node = nodeAt(tree, colPath);
        let items = [];
        if (colPath === "") {
          const names = sortNames(Object.keys(tree.kids), groupCounts);
          items = [
            { name: "全部", path: "", count: searched.length, hasKids: false },
            ...names.map((name) => {
              const child = tree.kids[name];
              return { name, path: name, count: groupCounts.get(name), hasKids: Object.keys(child.kids).length > 0 };
            })
          ];
        } else {
          items = Object.keys(node.kids).sort((a, b) => a.localeCompare(b, "zh")).map((name) => {
            const child = node.kids[name];
            return { name: child.name, path: child.path, count: child.count, hasKids: Object.keys(child.kids).length > 0 };
          });
        }
        const buttons = items.map((it) => {
          const on = selectedInCol(colPath, it.path) || (it.path === "" && !state.folder);
          return `<button class="folder ${it.hasKids ? "has-kids" : ""} ${on ? "on" : ""}" data-folder="${escapeHtml(it.path)}" style="--h:${hue(it.path || it.name)}"><em class="dot"></em><b>${escapeHtml(it.name)}</b><span>${it.count}</span></button>`;
        }).join("");
        return `<div class="nav-col">${buttons}</div>`;
      }).join("");

      document.getElementById("stats").textContent = `${visible.length} / ${ITEMS.length}`;

      const main = document.getElementById("main");
      if (!visible.length) {
        main.innerHTML = `<div class="empty">没有找到匹配的书签</div>`;
        return;
      }
      const sections = new Map();
      for (const item of visible) {
        const key = sectionKey(item);
        if (!sections.has(key)) sections.set(key, []);
        sections.get(key).push(item);
      }
      const order = state.folder
        ? [...sections.keys()].sort((a, b) => a.localeCompare(b, "zh"))
        : sortNames(sections.keys(), new Map([...sections].map(([k, v]) => [k, v.length])));
      if (!state.folder && !state.q.trim()) {
        main.innerHTML = `<div class="grid">${order.map((name) => `
          <button type="button" class="card" data-folder="${escapeHtml(name)}" data-key="folder:${escapeHtml(name)}" style="--h:${hue(name)}">
            <div class="ico"><span>${escapeHtml(name.charAt(0))}</span></div>
            <div>
              <h3>${escapeHtml(name)}</h3>
              <p>${sections.get(name).length} 个书签</p>
            </div>
            <i class="card-glow" aria-hidden="true"></i>
          </button>`).join("")}</div>`;
        applyFlips();
        return;
      }
      let used = 0;
      const html = [];
      for (const name of order) {
        const all = sections.get(name);
        if (used >= state.shown) break;
        const shown = all.slice(0, state.shown - used);
        used += shown.length;
        html.push(`
        <section class="section">
          <h2 style="--h:${hue(name)}"><em class="dot"></em>${escapeHtml(name)}<span>${all.length}</span></h2>
          <div class="grid">${shown.map(cardHtml).join("")}</div>
        </section>`);
      }
      if (used < visible.length) {
        html.push(`<button type="button" class="more" id="moreBtn">还有 ${visible.length - used} 个</button>`);
      }
      main.innerHTML = html.join("");
      applyFlips();
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function pickFolder(e) {
      const more = e.target.closest("#moreBtn");
      if (more) {
        state.shown += PAGE;
        render();
        return;
      }
      const card = e.target.closest("a.card, button.card");
      if (card && motionOk()) {
        const ripple = document.createElement("span");
        ripple.className = "ripple";
        card.appendChild(ripple);
        ripple.addEventListener("animationend", () => ripple.remove());
      }
      const btn = e.target.closest("[data-folder]");
      if (!btn) return;
      state.folder = btn.getAttribute("data-folder");
      try { localStorage.setItem("bm-folder", state.folder); } catch (e) {}
      state.shown = PAGE;
      render();
    }
    document.getElementById("nav").addEventListener("click", pickFolder);
    document.getElementById("main").addEventListener("click", pickFolder);
    let searchTimer = 0;
    document.getElementById("q").addEventListener("input", (e) => {
      state.q = e.target.value;
      document.body.classList.toggle("searching", !!state.q.trim());
      state.shown = PAGE;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(render, 80);
    });
    let windowSizeTimer = 0;
    function persistWindowSize() {
      const width = Math.round(window.outerWidth);
      const height = Math.round(window.outerHeight);
      if (width < 320 || height < 240) return;
      const maximized =
        Math.abs(width - screen.availWidth) <= 16 &&
        Math.abs(height - screen.availHeight) <= 16 &&
        Math.abs(window.screenX - screen.availLeft) <= 16 &&
        Math.abs(window.screenY - screen.availTop) <= 16;
      fetch("/__window_state", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ width, height, maximized }),
        keepalive: true
      }).catch(() => {});
    }
    function saveWindowSize() {
      clearTimeout(windowSizeTimer);
      windowSizeTimer = setTimeout(persistWindowSize, 300);
    }
    window.addEventListener("resize", saveWindowSize);
    window.addEventListener("pagehide", () => {
      clearTimeout(windowSizeTimer);
      persistWindowSize();
    });
    let moveRaf = 0;
    const rootStyle = document.documentElement.style;
    document.addEventListener("pointermove", (e) => {
      if (document.documentElement.dataset.fx === "off") return;
      if (motionOk() && starTrail.length < 280 && Math.random() < 0.8) {
        starTrail.push({
          x: e.clientX, y: e.clientY,
          vx: (Math.random() - 0.5) * 0.9,
          vy: (Math.random() - 0.5) * 0.9 - 0.35,
          r: 0.8 + Math.random() * 1.7,
          life: 1
        });
        startSky();
      }
      const x = e.clientX + "px";
      const y = e.clientY + "px";
      if (moveRaf) return;
      moveRaf = requestAnimationFrame(() => {
        moveRaf = 0;
        rootStyle.setProperty("--mx", x);
        rootStyle.setProperty("--my", y);
      });
    }, { passive: true });
    if (matchMedia("(hover: hover) and (pointer: fine)").matches) {
      const tiltPending = new Map();
      let tiltRaf = 0;
      const flushTilt = () => {
        tiltRaf = 0;
        for (const [card, ev] of tiltPending) {
          const r = card.getBoundingClientRect();
          const px = (ev.clientX - r.left) / r.width - 0.5;
          const py = (ev.clientY - r.top) / r.height - 0.5;
          card.classList.add("is-tilting");
          card.style.setProperty("--rx", (-py * 6.5).toFixed(2) + "deg");
          card.style.setProperty("--ry", (px * 8.5).toFixed(2) + "deg");
          card.style.setProperty("--gx", ((px + 0.5) * 100).toFixed(1) + "%");
          card.style.setProperty("--gy", ((py + 0.5) * 100).toFixed(1) + "%");
        }
        tiltPending.clear();
      };
      const mainEl = document.getElementById("main");
      mainEl.addEventListener("pointermove", (e) => {
        if (!motionOk()) return;
        const card = e.target.closest(".card");
        if (!card) return;
        tiltPending.set(card, e);
        if (!tiltRaf) tiltRaf = requestAnimationFrame(flushTilt);
      }, { passive: true });
      mainEl.addEventListener("pointerout", (e) => {
        const card = e.target.closest(".card");
        if (!card || card.contains(e.relatedTarget)) return;
        tiltPending.delete(card);
        card.classList.remove("is-tilting");
        card.style.setProperty("--rx", "0deg");
        card.style.setProperty("--ry", "0deg");
      }, { passive: true });
    }

    setupChoice(SKINS, "skin", "skinChoices", (id) => (id === "auto" ? autoSkin() : id));
    setupChoice(ICONS, "icon", "iconChoices");
    setupChoice(LAYOUTS, "layout", "layoutChoices");
    setupChoice(MOTIONS, "motion", "motionChoices");
    setupChoice(FX, "fx", "fxChoices");
    const colorSchemeMq = matchMedia("(prefers-color-scheme: light)");
    colorSchemeMq.addEventListener("change", () => {
      let s = null;
      try { s = localStorage.getItem("bm-skin"); } catch (e) {}
      if ((s || "") === "auto") {
        const resolved = autoSkin();
        document.documentElement.dataset.skin = resolved;
        const fav = document.getElementById("fav");
        if (fav) fav.href = "/__favicon?skin=" + encodeURIComponent(resolved);
        fetch("/__icon?skin=" + encodeURIComponent(resolved)).catch(() => {});
      }
    });
    const appearanceBtn = document.getElementById("appearanceBtn");
    const appearancePanel = document.getElementById("appearancePanel");
    function setAppearanceOpen(open) {
      appearancePanel.hidden = !open;
      appearanceBtn.setAttribute("aria-expanded", String(open));
      document.body.classList.toggle("appearance-open", open);
    }
    appearanceBtn.addEventListener("click", () => setAppearanceOpen(appearancePanel.hidden));
    document.addEventListener("click", (event) => {
      if (!appearancePanel.hidden &&
          !appearancePanel.contains(event.target) &&
          !appearanceBtn.contains(event.target)) setAppearanceOpen(false);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") setAppearanceOpen(false);
    });
    const searchInput = document.getElementById("q");
    const isMac = /Mac|iPhone|iPad/.test(navigator.platform || "");
    document.getElementById("searchKbd").textContent = isMac ? "\u2318K" : "Ctrl K";
    document.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && !event.altKey && !event.shiftKey && event.key.toLowerCase() === "k") {
        event.preventDefault();
        searchInput.focus();
        searchInput.select();
      }
    });
    window.addEventListener("focus", () => {
      const ae = document.activeElement;
      if (!ae || ae === document.body || (ae.closest && ae.closest("#main, #nav"))) searchInput.focus();
    });
    document.getElementById("weather").addEventListener("click", async () => {
      const cur = readJson("bm-city");
      const name = window.prompt("输入城市", cur && cur.name || "");
      if (name) {
        const city = await searchCity(name.trim());
        if (!city) {
          setWeatherUI("没找到这个城市", null);
          return;
        }
        writeJson("bm-city", city);
        localStorage.removeItem("bm-weather");
      } else if (!cur) {
        return;
      }
      setWeatherUI("天气加载中…", null);
      loadWeather();
    });
    const fxCanvas = document.getElementById("fx-canvas");
    const fxCtx = fxCanvas.getContext("2d");
    let skyType = null;
    let populatedType = null;
    let skyDrops = [];
    let starTrail = [];
    let skyRunning = false;
    let skyLast = 0;
    let currentWeatherCode = null;
    function skyClass(code) {
      if (code == null) return null;
      if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95) return "rain";
      if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
      if (code <= 2) return "stars";
      return null;
    }
    function fxResize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      fxCanvas.width = Math.round(innerWidth * dpr);
      fxCanvas.height = Math.round(innerHeight * dpr);
      fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function skyPopulate() {
      skyDrops = [];
      const n = skyType === "rain" ? 130 : skyType === "snow" ? 80 : skyType === "stars" ? 46 : 0;
      for (let i = 0; i < n; i++) {
        const d = { x: Math.random() * innerWidth, y: Math.random() * innerHeight, ph: Math.random() * 6.28 };
        if (skyType === "rain") { d.v = 7 + Math.random() * 5; d.len = 10 + Math.random() * 12; }
        else if (skyType === "snow") { d.v = 0.6 + Math.random() * 0.9; d.r = 1 + Math.random() * 2.1; }
        else if (skyType === "stars") { d.v = 0.1 + Math.random() * 0.22; d.r = 0.7 + Math.random() * 1.5; }
        skyDrops.push(d);
      }
    }
    function fxInk() {
      return document.documentElement.dataset.skin === "paper" ? "96, 76, 44" : "185, 216, 255";
    }
    function skyFrame(ts) {
      if (!skyRunning) return;
      const dt = Math.min(ts - skyLast || 16.7, 50) / 16.7;
      skyLast = ts;
      fxCtx.clearRect(0, 0, innerWidth, innerHeight);
      const ink = fxInk();
      if (skyType === "rain") {
        fxCtx.strokeStyle = "rgba(" + ink + ", 0.3)";
        fxCtx.lineWidth = 1;
        fxCtx.beginPath();
        for (const d of skyDrops) {
          d.y += d.v * dt;
          d.x += d.v * dt * 0.12;
          if (d.y > innerHeight + 24) { d.y = -24; d.x = Math.random() * innerWidth; }
          fxCtx.moveTo(d.x, d.y);
          fxCtx.lineTo(d.x - d.len * 0.12, d.y - d.len);
        }
        fxCtx.stroke();
      } else if (skyType === "snow" || skyType === "stars") {
        for (const d of skyDrops) {
          if (skyType === "snow") {
            d.y += d.v * dt;
            d.ph += 0.012 * dt;
            d.x += Math.sin(d.ph) * 0.5 * dt;
            if (d.y > innerHeight + 6) { d.y = -6; d.x = Math.random() * innerWidth; }
            fxCtx.fillStyle = "rgba(" + ink + ", 0.5)";
          } else {
            d.y -= d.v * dt;
            d.ph += 0.02 * dt;
            if (d.y < -6) { d.y = innerHeight + 6; d.x = Math.random() * innerWidth; }
            fxCtx.fillStyle = "rgba(" + ink + ", " + (0.1 + 0.3 * Math.abs(Math.sin(d.ph))).toFixed(3) + ")";
          }
          fxCtx.beginPath();
          fxCtx.arc(d.x, d.y, d.r, 0, 6.29);
          fxCtx.fill();
        }
      }
      for (let i = starTrail.length - 1; i >= 0; i--) {
        const p = starTrail[i];
        p.life -= 0.045 * dt;
        if (p.life <= 0) { starTrail.splice(i, 1); continue; }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        fxCtx.fillStyle = "rgba(" + ink + ", " + (p.life * 0.5).toFixed(3) + ")";
        fxCtx.beginPath();
        fxCtx.arc(p.x, p.y, Math.max(p.r * p.life, 0.2), 0, 6.29);
        fxCtx.fill();
      }
      if (skyType || starTrail.length) requestAnimationFrame(skyFrame);
      else skyRunning = false;
    }
    function startSky() {
      if (skyRunning) return;
      skyRunning = true;
      skyLast = 0;
      requestAnimationFrame(skyFrame);
    }
    function syncParticles() {
      const run = motionOk();
      skyType = run ? skyClass(currentWeatherCode) : null;
      if (skyType !== populatedType) {
        skyPopulate();
        populatedType = skyType;
      }
      if (run && (skyType || starTrail.length)) {
        startSky();
      } else if (skyRunning) {
        skyRunning = false;
        starTrail.length = 0;
        fxCtx.clearRect(0, 0, innerWidth, innerHeight);
      }
    }
    window.addEventListener("resize", fxResize);
    fxResize();
    syncParticles();
    window.addEventListener("bm-fx", syncParticles);
    reduceMotionMq.addEventListener("change", syncParticles);

    tick();
    setInterval(tick, 10000);
    loadWeather(true);
    if (!ITEMS.length) {
      document.getElementById("main").innerHTML = '<div class="empty">暂无书签数据</div>';
    } else {
      render();
    }
  </script>
</body>
</html>
