<!DOCTYPE html>
<html lang="zh-CN" data-skin="aurora" data-icon="logo" data-layout="classic" data-motion="float" data-fx="on" data-trail="stardust" data-sky="auto">
<head>
  <meta charset="UTF-8" />
  <script src="js/bootstrap.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>书签</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/weather.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/appearance.css" />
  <link rel="stylesheet" href="css/bookmarks.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/icons.css" />
  <link rel="stylesheet" href="css/layouts.css" />
  <link rel="stylesheet" href="css/motion.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="aurora"></div>
  <div class="weather-scene" id="weatherScene" aria-hidden="true" hidden>
    <div class="weather-orb"></div>
    <div class="weather-cloud weather-cloud-back"></div>
    <div class="weather-cloud"></div>
    <div class="weather-mist"></div>
  </div>
  <canvas id="fx-canvas" aria-hidden="true"></canvas>
  <div class="app-meta">
    <div id="appVersion" class="app-version" aria-label="当前版本">v1.0.3</div>
    <div id="updateNotice" class="update-notice" hidden>
      <button type="button" id="updateBtn" class="update-action" aria-label="发现新版本，点击升级" title="发现新版本，点击升级"></button>
    </div>
  </div>
  <div class="bg-clock" aria-hidden="true">
    <span class="bg-time" id="bgTime"></span>
  </div>
  <div class="cursor-glow" aria-hidden="true"></div>
  <header>
    <div class="hello">
      <div id="clock" class="time">--:--:--</div>
      <div class="calendar-dates">
        <div class="calendar-solar"><span class="calendar-label">公历</span><span id="greet">书签</span></div>
        <div class="calendar-lunar"><span class="calendar-label">农历</span><span id="lunarDate"></span></div>
      </div>
      <div class="weather-row">
        <button type="button" id="weather" class="weather" title="点击查看或切换城市"><span class="w-ico" id="weatherIco" aria-hidden="true"></span><span class="w-txt" id="weatherTxt">点击查看天气</span></button>
        <button type="button" id="weatherRefresh" class="weather-refresh" title="刷新天气（每 10 分钟自动刷新）" aria-label="刷新天气">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 7a7 7 0 0 1 11.4-1L20 9M4 15l2.5 3A7 7 0 0 0 17.9 17"/></svg>
        </button>
      </div>
    </div>
    <div class="search">
      <svg class="search-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
        <path d="M16 16l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <input id="q" type="search" placeholder="搜索书签、网站或分类" autofocus />
      <kbd class="search-kbd" id="searchKbd" aria-hidden="true">Ctrl K</kbd>
    </div>
    <div class="tools">
      <button type="button" id="appearanceBtn" class="stat appearance-trigger" aria-expanded="false" aria-controls="appearanceMenu">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3a9 9 0 1 0 0 18h1.2a1.8 1.8 0 0 0 0-3.6h-.7a1.5 1.5 0 0 1 0-3h2.4A6.1 6.1 0 0 0 21 8.3C20.3 5.2 16.5 3 12 3Z" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="7.5" cy="10" r="1" fill="currentColor"/><circle cx="10" cy="6.8" r="1" fill="currentColor"/><circle cx="15" cy="7" r="1" fill="currentColor"/>
        </svg>
        <span id="appearanceLabel">外观</span>
      </button>
      <div id="stats" class="stat"></div>
    </div>
    <div id="appearanceMenu" class="appearance-panel appearance-menu" hidden aria-label="外观设置">
      <div class="appearance-head"><div><strong>外观实验室</strong><small>即时预览 · 自动记忆</small></div><button type="button" id="appearanceMenuClose" class="appearance-close" aria-label="关闭外观菜单">×</button></div>
      <div id="appearanceCategories" class="appearance-categories">
        <button type="button" class="appearance-category" data-setting="skin" aria-expanded="false" aria-controls="appearancePanel">
          <span class="appearance-art" aria-hidden="true"><svg viewBox="0 0 52 48" fill="none"><defs><linearGradient id="menuPrism" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#fb7185"/></linearGradient></defs><circle cx="26" cy="24" r="14" fill="url(#menuPrism)" opacity=".22"/><circle cx="26" cy="24" r="9" fill="url(#menuPrism)"/><g class="art-orbit"><ellipse cx="26" cy="24" rx="23" ry="10" fill="none" stroke="url(#menuPrism)" stroke-width="2" transform="rotate(-32 26 24)"/><circle cx="44" cy="12" r="3" fill="#38bdf8"/><circle cx="9" cy="35" r="2.5" fill="#fb7185"/></g><path d="m27 17 2 4-4-1" fill="#fff" opacity=".8"/></svg></span>
          <span class="appearance-category-copy"><b>页面主题</b><small data-setting-summary="skin"></small></span>
          <span class="appearance-category-arrow" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none"><path d="m4.5 3 3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
        <button type="button" class="appearance-category" data-setting="icon" aria-expanded="false" aria-controls="appearancePanel">
          <span class="appearance-art" aria-hidden="true"><svg viewBox="0 0 52 48" fill="none"><defs><linearGradient id="menuIcon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect x="8" y="7" width="28" height="32" rx="8" fill="currentColor" opacity=".16" transform="rotate(-15 22 23)"/><g class="art-animated art-card"><rect x="16" y="10" width="28" height="32" rx="8" fill="url(#menuIcon)" stroke="#fff" stroke-opacity=".4" transform="rotate(10 30 26)"/><path d="m29 17 2.8 6 6.5.8-4.8 4.4 1.2 6.4-5.7-3.3-5.7 3.3 1.2-6.4-4.8-4.4 6.5-.8Z" fill="#fff" opacity=".94"/></g></svg></span>
          <span class="appearance-category-copy"><b>网站图标</b><small data-setting-summary="icon"></small></span>
          <span class="appearance-category-arrow" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none"><path d="m4.5 3 3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
        <button type="button" class="appearance-category" data-setting="layout" aria-expanded="false" aria-controls="appearancePanel">
          <span class="appearance-art" aria-hidden="true"><svg viewBox="0 0 52 48" fill="none"><rect x="5" y="8" width="42" height="32" rx="6" fill="currentColor" fill-opacity=".1" stroke="currentColor" stroke-opacity=".65"/><path d="M5 16h42M16 16v24" stroke="currentColor" stroke-opacity=".45"/><circle cx="10" cy="12" r="1.2" fill="currentColor"/><circle cx="14" cy="12" r="1.2" fill="currentColor" opacity=".5"/><g><rect class="art-animated art-tile" x="21" y="21" width="9" height="6" rx="2" fill="currentColor"/><rect class="art-animated art-tile" x="33" y="21" width="9" height="6" rx="2" fill="currentColor" opacity=".55"/><rect class="art-animated art-tile" x="21" y="30" width="9" height="5" rx="2" fill="currentColor" opacity=".55"/><rect class="art-animated art-tile" x="33" y="30" width="9" height="5" rx="2" fill="currentColor" opacity=".3"/></g></svg></span>
          <span class="appearance-category-copy"><b>页面布局</b><small data-setting-summary="layout"></small></span>
          <span class="appearance-category-arrow" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none"><path d="m4.5 3 3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
        <button type="button" class="appearance-category" data-setting="motion" aria-expanded="false" aria-controls="appearancePanel">
          <span class="appearance-art" aria-hidden="true"><svg viewBox="0 0 52 48" fill="none"><ellipse cx="28" cy="26" rx="20" ry="16" fill="currentColor" opacity=".07"/><path d="M7 18h10M3 25h12M8 32h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity=".45"/><g class="art-animated art-bolt"><path d="m30 6-12 21h11l-3 16 17-23H31l4-14Z" fill="currentColor"/><path d="m31 10-6 13h7" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".75"/></g></svg></span>
          <span class="appearance-category-copy"><b>图标动效</b><small data-setting-summary="motion"></small></span>
          <span class="appearance-category-arrow" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none"><path d="m4.5 3 3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
        <button type="button" class="appearance-category" data-setting="trail" aria-expanded="false" aria-controls="appearancePanel">
          <span class="appearance-art" aria-hidden="true"><svg viewBox="0 0 52 48" fill="none"><path d="M4 37c16 0 7-23 22-19s9 17 22-9" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="7" stroke-linecap="round"/><path d="M4 37c16 0 7-23 22-19s9 17 22-9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" class="art-animated art-stream" stroke-dasharray="1 6"/><path class="art-animated art-spark" d="m34 10 3-7 3 7 7 3-7 3-3 7-3-7-7-3Z" fill="currentColor"/><circle cx="17" cy="28" r="3" fill="#a78bfa"/><circle cx="6" cy="38" r="2" fill="#38bdf8"/><circle cx="26" cy="35" r="1.6" fill="currentColor" opacity=".6"/></svg></span>
          <span class="appearance-category-copy"><b>鼠标拖尾</b><small data-setting-summary="trail"></small></span>
          <span class="appearance-category-arrow" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none"><path d="m4.5 3 3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
        <button type="button" class="appearance-category" data-setting="sky" aria-expanded="false" aria-controls="appearancePanel">
          <span class="appearance-art" aria-hidden="true"><svg viewBox="0 0 52 48" fill="none"><circle cx="26" cy="24" r="18" fill="currentColor" opacity=".1"/><g class="art-orbit"><path d="m10 29 12-16 15 9 7-14M22 13l8 25 7-16" fill="none" stroke="currentColor" stroke-opacity=".38" stroke-width="1.2"/><circle cx="10" cy="29" r="2.3" fill="#38bdf8"/><circle cx="22" cy="13" r="3" fill="currentColor"/><circle cx="37" cy="22" r="2.5" fill="#38bdf8"/><circle cx="30" cy="38" r="2" fill="currentColor"/><path d="m44 3 1.7 4.3L50 9l-4.3 1.7L44 15l-1.7-4.3L38 9l4.3-1.7Z" fill="currentColor"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="44" cy="36" r="1" fill="currentColor"/></g></svg></span>
          <span class="appearance-category-copy"><b>背景特效</b><small data-setting-summary="sky"></small></span>
          <span class="appearance-category-arrow" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none"><path d="m4.5 3 3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
        <button type="button" class="appearance-category" data-setting="fx" aria-expanded="false" aria-controls="appearancePanel">
          <span class="appearance-art" aria-hidden="true"><svg viewBox="0 0 52 48" fill="none"><circle cx="26" cy="24" r="20" fill="currentColor" opacity=".07"/><circle class="art-orbit" cx="26" cy="24" r="19" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-dasharray="3 5"/><g class="art-animated art-power"><path d="M18 13a14 14 0 1 0 16 0" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M26 7v17" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><circle cx="26" cy="39" r="1.6" fill="#fff" opacity=".8"/></g></svg></span>
          <span class="appearance-category-copy"><b>动态效果</b><small data-setting-summary="fx"></small></span>
          <span class="appearance-category-arrow" aria-hidden="true"><svg viewBox="0 0 12 12" fill="none"><path d="m4.5 3 3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </button>
      </div>
    </div>
    <div id="appearancePanel" class="appearance-panel appearance-detail" hidden role="dialog" aria-labelledby="appearanceTitle" aria-describedby="appearanceDescription">
      <div class="appearance-head">
        <button type="button" id="appearanceBack" class="appearance-back" aria-label="返回外观菜单">‹</button>
        <strong id="appearanceTitle">页面主题</strong>
        <button type="button" id="appearanceClose" class="appearance-close" aria-label="关闭功能设置">×</button>
      </div>
      <p id="appearanceDescription" class="appearance-description"></p>
      <div class="appearance-body">
        <section class="appearance-group" data-setting-panel="skin" data-title="页面主题" data-description="选择整页配色。「自动」跟随系统深浅色，切换时同步快捷方式图标。" hidden>
          <div id="skinChoices" class="choice-grid"></div>
        </section>
        <section class="appearance-group" data-setting-panel="icon" data-title="网站图标" data-description="调整书签卡片中的图标外观，不改变页面布局。" hidden>
          <div id="iconChoices" class="choice-grid"></div>
        </section>
        <section class="appearance-group" data-setting-panel="layout" data-title="页面布局" data-description="选择书签卡片的排列方式和信息密度。" hidden>
          <div id="layoutChoices" class="choice-grid layout-grid"></div>
        </section>
        <section class="appearance-group" data-setting-panel="motion" data-title="图标动效" data-description="选择鼠标悬停在书签卡片上时的图标动画。" hidden>
          <div id="motionChoices" class="choice-grid motion-grid"></div>
        </section>
        <section class="appearance-group" data-setting-panel="trail" data-title="鼠标拖尾" data-description="选择鼠标移动时的粒子样式，并调整拖尾大小。" hidden>
          <div id="trailChoices" class="choice-grid trail-grid"></div>
          <div class="trail-size-row">
            <span class="trail-size-label">大小</span>
            <button type="button" id="trailSizeDown" class="trail-size-btn" aria-label="缩小">−</button>
            <input id="trailSize" class="trail-size" type="range" min="50" max="250" step="10" value="100" aria-label="拖尾大小" />
            <button type="button" id="trailSizeUp" class="trail-size-btn" aria-label="放大">+</button>
            <span id="trailSizeVal" class="trail-size-val">1.0×</span>
          </div>
        </section>
        <section class="appearance-group" data-setting-panel="sky" data-title="背景特效" data-description="跟随天气呈现日夜天空、云雾和雨雪；大小、数量调节背景粒子。" hidden>
          <div id="skyChoices" class="choice-grid sky-grid"></div>
          <div class="trail-size-row">
            <span class="trail-size-label">大小</span>
            <button type="button" id="skySizeDown" class="trail-size-btn" aria-label="缩小">−</button>
            <input id="skySize" class="trail-size" type="range" min="50" max="250" step="10" value="100" aria-label="特效大小" />
            <button type="button" id="skySizeUp" class="trail-size-btn" aria-label="放大">+</button>
            <span id="skySizeVal" class="trail-size-val">1.0×</span>
          </div>
          <div class="trail-size-row">
            <span class="trail-size-label">数量</span>
            <button type="button" id="skyCountDown" class="trail-size-btn" aria-label="减少">−</button>
            <input id="skyCount" class="trail-size" type="range" min="25" max="250" step="25" value="100" aria-label="特效数量" />
            <button type="button" id="skyCountUp" class="trail-size-btn" aria-label="增多">+</button>
            <span id="skyCountVal" class="trail-size-val">1.0×</span>
          </div>
        </section>
        <section class="appearance-group" data-setting-panel="fx" data-title="动态效果" data-description="统一开启或关闭动态效果，保留各项样式与参数。" hidden>
          <div id="fxChoices" class="choice-grid fx-grid"></div>
        </section>
      </div>
      <p class="appearance-note">即时预览并自动记忆，关闭后可查看完整效果。</p>
    </div>
  </header>
  <div class="layout">
    <div id="nav" class="nav-cols"></div>
    <main id="main"></main>
  </div>
  <script src="js/data-loader.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/utils.js"></script>
  <script defer src="js/bookmarks.js"></script>
  <script defer src="js/bookmark-layouts.js"></script>
  <script defer src="js/weather.js"></script>
  <script defer src="js/clock.js"></script>
  <script defer src="js/appearance.js"></script>
  <script defer src="js/window-state.js"></script>
  <script defer src="js/interactions.js"></script>
  <script defer src="js/update.js"></script>
  <script defer src="js/effects.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
