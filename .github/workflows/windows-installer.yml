name: windows-installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Inno Setup
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw 'Inno Setup 6 is required on the Windows runner.' }
          $language = Join-Path (Split-Path $compiler) 'Languages\ChineseSimplified.isl'
          if (-not (Test-Path $language)) {
            Invoke-WebRequest 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl' -OutFile $language
          }
      - name: Test installer packaging
        run: .\runtime\python\python.exe -B -X utf8 -m unittest discover -s tests -p test_installer.py
      - name: Build installer
        run: .\runtime\python\python.exe -B -X utf8 scripts/build_installer.py
      - name: Verify install, upgrade and uninstall
        run: .\runtime\python\python.exe -B -X utf8 tests/installer_smoke.py
      - name: Upload installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            installer/Bookmark_Setup_v*.exe
            installer/Bookmark_Setup_v*.sha256
            installer/Bookmark_Setup_v*.manifest.json
      - name: Upload installer verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-verification
          if-no-files-found: ignore
          path: |
            installer/verify-*/*.log
            installer/verify-*/*.json
