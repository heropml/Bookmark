name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Frontend tests
        run: node --test "tests/*.test.cjs"
      - name: Python tests
        run: python -B -m unittest discover -s tests -p "test_*.py"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Versions are pinned so a new release cannot turn an unchanged commit red.
      - name: Python checks (ruff)
        run: |
          python -m pip install ruff==0.16.10
          ruff check .
      - name: JavaScript checks (eslint)
        run: npx --yes eslint@10.12.0 .
